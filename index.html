<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#3f9d5a" />
  <title>국립세종수목원 식물도감</title>
  <meta name="description" content="국립세종수목원 식물도감 - QR로 식물을 수집하고 뱃지를 획득하는 무설치 웹 체험" />

  <!-- 아이콘 (lucide) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <!-- 폭죽 효과 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- 웹 QR 스캐너 -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <!-- Supabase (진행 데이터 클라우드 저장/이어하기) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 폰트: Pretendard(가독성) + Galmuri(레트로 픽셀) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/quiple/galmuri@latest/dist/galmuri.css" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== 입장 코드 로그인 화면 ===== -->
  <div id="login-overlay" class="login-overlay">
    <div class="login-card">
      <div class="login-logo"><i data-lucide="leaf"></i></div>
      <h1 class="login-title">국립세종수목원<br>식물도감</h1>
      <p class="login-sub">입장권에 적힌 <strong>6자리 번호</strong>를 입력하고<br>식물 탐험을 시작하세요.</p>
      <input id="login-code" class="login-input" type="tel" inputmode="numeric"
             maxlength="6" placeholder="● ● ● ● ● ●" autocomplete="off" />
      <div id="login-error" class="login-error"></div>
      <button id="login-start" class="login-btn">시작하기</button>
      <p class="login-note">같은 번호로 다시 접속하면 진행 상황이 이어집니다.</p>
    </div>
  </div>

  <div id="app">
    <!-- ===== 상단 헤더 (진행도) ===== -->
    <header class="app-header">
      <div class="header-title">
        <span class="logo-mark"><i data-lucide="leaf"></i></span>
        <div class="header-text">
          <h1>국립세종수목원 식물도감</h1>
          <p>QR로 식물을 모아보세요</p>
        </div>
        <button id="logout-btn" class="logout-btn" aria-label="로그아웃">
          <i data-lucide="log-out"></i>
          <span>로그아웃</span>
        </button>
      </div>
      <div id="current-code" class="current-code"></div>
      <div class="progress-wrap">
        <div class="progress-label">
          <span>수집 진행도</span>
          <strong id="progress-text">0 / 30 (0%)</strong>
        </div>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      </div>
    </header>

    <!-- ===== 메인 콘텐츠 (탭 뷰) ===== -->
    <main id="main-view">

      <!-- 탐색 탭: 인터랙티브 지도 -->
      <section id="view-map" class="view active">
        <div class="section-head">
          <h2><i data-lucide="map"></i> 수목원 탐색 지도</h2>
          <p>핀을 눌러 식물 위치 힌트를 확인하세요.</p>
        </div>
        <div class="map-frame" id="map-frame">
          <div class="map-bg" id="map-bg"></div>
          <div id="map-markers"></div>
        </div>
        <div class="legend">
          <span><span class="dot dot-locked"></span> 미수집</span>
          <span><span class="dot dot-done"></span> 수집 완료</span>
        </div>
      </section>

      <!-- 도감 탭 -->
      <section id="view-dex" class="view">
        <div class="section-head">
          <h2><i data-lucide="book-open"></i> 식물도감</h2>
          <p>수집한 식물이 컬러로 활성화됩니다.</p>
        </div>
        <div id="dex-grid" class="dex-grid"></div>
      </section>

      <!-- 뱃지 탭 -->
      <section id="view-badges" class="view">
        <div class="section-head">
          <h2><i data-lucide="medal"></i> 업적 & 뱃지</h2>
          <p>조건을 달성하면 뱃지가 해금됩니다.</p>
        </div>
        <div id="badge-grid" class="badge-grid"></div>
        <div id="cert-zone" class="cert-zone"></div>
      </section>

    </main>

    <!-- ===== 웹 QR 스캔 버튼 (플로팅) ===== -->
    <button id="scan-fab" class="scan-fab" aria-label="QR 스캔">
      <i data-lucide="scan-line"></i>
      <span class="scan-fab-label">QR 스캔</span>
    </button>

    <!-- ===== 하단 탭 바 ===== -->
    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="map"><i data-lucide="map-pin"></i><span>탐색</span></button>
      <button class="tab-btn" data-tab="dex"><i data-lucide="book-open"></i><span>도감</span></button>
      <button class="tab-btn" data-tab="badges"><i data-lucide="award"></i><span>뱃지</span></button>
    </nav>
  </div>

  <!-- ===== 식물 상세 모달 ===== -->
  <div id="plant-modal" class="modal-overlay">
    <div class="modal-card" id="plant-modal-card"></div>
  </div>

  <!-- ===== 수집 축하 팝업 ===== -->
  <div id="collect-popup" class="modal-overlay">
    <div class="collect-card" id="collect-card"></div>
  </div>

  <!-- ===== QR 스캐너 모달 ===== -->
  <div id="scanner-modal" class="modal-overlay">
    <div class="scanner-card">
      <div class="scanner-head">
        <h3><i data-lucide="scan-line"></i> QR 스캔</h3>
        <button id="scanner-close" class="icon-btn"><i data-lucide="x"></i></button>
      </div>
      <div id="qr-reader"></div>
      <p class="scanner-hint">푯말의 QR코드를 사각형 안에 맞춰주세요.</p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
