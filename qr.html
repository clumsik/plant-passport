<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>세종수목원 식물 QR 시트 (현장 부착용)</title>
  <!-- QR 생성 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", -apple-system, sans-serif;
      background: #f4f1e8; color: #2c3327; margin: 0; padding: 24px;
    }
    .page-head {
      max-width: 900px; margin: 0 auto 20px; text-align: center;
    }
    .page-head h1 { font-size: 22px; margin: 0 0 6px; color: #2f6d4f; }
    .page-head p { font-size: 13px; color: #7a8472; margin: 2px 0; }
    .toolbar { text-align: center; margin-bottom: 20px; }
    .btn {
      background: #3f9d5a; color: #fff; border: none; border-radius: 8px;
      padding: 10px 20px; font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .grid {
      max-width: 900px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
    }
    .card {
      background: #fff; border: 1px solid #e2dcc9; border-radius: 14px;
      padding: 18px; text-align: center; page-break-inside: avoid;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .card .qr { width: 200px; height: 200px; display: grid; place-items: center; }
    .card .qr img, .card .qr canvas { width: 200px !important; height: 200px !important; }
    .card .name { font-size: 20px; font-weight: 800; }
    .card .pid { font-size: 12px; color: #8a8570; letter-spacing: 0.5px; }
    .card .loc { font-size: 12px; color: #3f9d5a; }
    .card .cut { font-size: 10px; color: #b8b19a; margin-top: 2px; }
    @media print {
      body { background: #fff; padding: 0; }
      .toolbar { display: none; }
      .grid { gap: 10px; }
      .card { border: 1px dashed #bbb; }
    }
  </style>
</head>
<body>
  <div class="page-head">
    <h1>🌿 국립세종수목원 식물 QR 시트</h1>
    <p>각 QR에는 식물 ID만 담겨 있습니다. 앱의 "QR 스캔" 버튼으로 촬영해야 인식됩니다.</p>
    <p>아래 카드를 인쇄해 오려서 각 식물 앞 푯말에 부착하세요.</p>
  </div>
  <div class="toolbar">
    <button class="btn" onclick="window.print()">🖨️ 인쇄 / PDF 저장</button>
  </div>
  <div class="grid" id="grid"></div>

  <!-- 식물 데이터 재사용 -->
  <script src="data.js"></script>
  <script>
    (function () {
      var grid = document.getElementById("grid");
      var zoneName = function (zid) {
        var z = (typeof ZONES !== "undefined") ? ZONES.find(function (z) { return z.id === zid; }) : null;
        return z ? z.name : "";
      };
      if (typeof PLANTS === "undefined" || !PLANTS.length) {
        grid.innerHTML = "<p style='text-align:center'>식물 데이터(data.js)를 찾을 수 없습니다.</p>";
        return;
      }
      PLANTS.forEach(function (p) {
        var card = document.createElement("div");
        card.className = "card";
        var loc = p.locations || zoneName(p.zone);
        card.innerHTML =
          '<div class="qr" id="qr_' + p.id + '"></div>' +
          '<div class="name">' + p.name + '</div>' +
          '<div class="loc">📍 ' + loc + '</div>' +
          '<div class="pid">' + p.id + '</div>' +
          '<div class="cut">✂️ 잘라서 현장 푯말에 부착</div>';
        grid.appendChild(card);
        // QR 내용 = 식물 ID만 (방식 B)
        new QRCode(document.getElementById("qr_" + p.id), {
          text: p.id,
          width: 200,
          height: 200,
          correctLevel: QRCode.CorrectLevel.H
        });
      });
    })();
  </script>
</body>
</html>
